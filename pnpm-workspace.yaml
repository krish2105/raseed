packages:
  - "apps/*"
  - "packages/*"

# Mirrors .npmrc's node-linker=hoisted. pnpm 11+ reads this file, not .npmrc.
nodeLinker: hoisted

# pnpm 10 blocks dependency lifecycle scripts by default. Expo/RN native deps need these
# to run or the install silently produces a broken tree.
onlyBuiltDependencies:
  # Skia's postinstall downloads its prebuilt binaries. Without this, `pod install` fails
  # with "Skia prebuilt binaries not found" — pnpm 10 blocks lifecycle scripts by default.
  - '@shopify/react-native-skia'
  - esbuild
  - sharp
  - unrs-resolver
