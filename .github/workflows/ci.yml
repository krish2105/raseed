name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` for the secret scan below, and it is not optional on pull requests.
      # `actions/checkout` clones one commit by default; gitleaks needs the merge-base to know
      # which commits are new, and without it fails with the unhelpful "failed to scan Git
      # repository / stderr is not empty". Every open PR was red for this reason and none of
      # them for their own contents — including one that changes a single action version and no
      # code at all, which is what gave it away.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vercel builds from a tarball, not a checkout. A lifecycle script that assumes a git
      # repository takes `pnpm install` down with it — exit 128, deploy fails, and CI stays
      # green, because `actions/checkout` above DOES give us a `.git` and Vercel does not.
      # That gap cost a production deploy. Run the scripts where there is no repository.
      - name: Lifecycle scripts survive a non-git checkout
        run: |
          tmp="$(mktemp -d)"
          cp package.json "$tmp/"
          cd "$tmp"
          git rev-parse --git-dir > /dev/null 2>&1 && { echo "mktemp dir is inside a repo; test is void"; exit 1; }
          npm run prepare

      # A leaked key is not a bug you can fix in a follow-up commit — git history is public
      # the moment the repo is, and rotation is the only remedy. Scanned on every push.
      - name: Secret scan (history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # High and critical only. Failing on every low-severity transitive advisory trains
      # everyone to ignore the gate, which is worse than not having one.
      - name: Dependency audit
        run: pnpm audit --audit-level high

      # --continue so a failure in one workspace still reports the others.
      # Session 0's whole point is that breaking a shared package fails BOTH apps —
      # fail-fast would hide the second one.
      - run: pnpm exec turbo typecheck lint test --continue

      # C3. The floor is on packages/* only, and set just under the measured numbers rather
      # than at a round aspiration — see vitest.config.ts for why the apps are excluded.
      - name: Coverage floor (packages)
        run: pnpm coverage

      # Playwright drives a real production build: `next build && next start`. The bugs
      # worth catching here live in the production path — the worker chunk only exists
      # there, and a dev-only pass would prove nothing about either.
      - run: pnpm --filter web exec playwright install --with-deps chromium

      - run: pnpm --filter web e2e
