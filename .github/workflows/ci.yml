name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --continue so a failure in one workspace still reports the others.
      # Session 0's whole point is that breaking a shared package fails BOTH apps —
      # fail-fast would hide the second one.
      - run: pnpm exec turbo typecheck lint test --continue
