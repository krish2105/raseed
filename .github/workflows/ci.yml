name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A leaked key is not a bug you can fix in a follow-up commit — git history is public
      # the moment the repo is, and rotation is the only remedy. Scanned on every push.
      - name: Secret scan (history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # High and critical only. Failing on every low-severity transitive advisory trains
      # everyone to ignore the gate, which is worse than not having one.
      - name: Dependency audit
        run: pnpm audit --audit-level high

      # --continue so a failure in one workspace still reports the others.
      # Session 0's whole point is that breaking a shared package fails BOTH apps —
      # fail-fast would hide the second one.
      - run: pnpm exec turbo typecheck lint test --continue

      # C3. The floor is on packages/* only, and set just under the measured numbers rather
      # than at a round aspiration — see vitest.config.ts for why the apps are excluded.
      - name: Coverage floor (packages)
        run: pnpm coverage

      # Playwright drives a real production build: `next build && next start`. The bugs
      # worth catching here live in the production path — the worker chunk only exists
      # there, and a dev-only pass would prove nothing about either.
      - run: pnpm --filter web exec playwright install --with-deps chromium

      - run: pnpm --filter web e2e
